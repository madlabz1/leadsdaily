    <path d="M23 2C11.4 2 2 11.4 2 23s9.4 21 21 21c9.2 0 17-5.9 19.9-14.1" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Orange arc segment -->
    <path d="M42.9 18.9C41.7 10.1 34.9 3.3 26.1 2.1" stroke="#f97316" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Arrow/compass pointer - orange -->

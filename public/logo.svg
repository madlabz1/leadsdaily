    <!-- Arrow bottom - dark -->
    <polygon points="23,38 16,23 23,26 30,23" fill="#ffffff"/>
  </g>
  <!-- Text -->
  <text x="56" y="35" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#ffffff">leads</tspan><tspan fill="#f97316">daily</tspan>

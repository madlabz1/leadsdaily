<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" fill="none">
  <!-- Clock Icon -->
  <g transform="translate(4, 4)">
    <!-- Outer circle - full dark ring -->
    <circle cx="24" cy="24" r="22" stroke="#18181b" stroke-width="3.5" fill="none"/>

    <!-- Tick marks (12 positions) -->
    <!-- 12 o'clock -->
    <line x1="24" y1="4" x2="24" y2="9" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 1 o'clock -->
    <line x1="33" y1="6.5" x2="31" y2="11" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
    <!-- 2 o'clock -->
    <line x1="39.5" y1="13" x2="35.5" y2="15.5" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
    <!-- 3 o'clock -->
    <line x1="44" y1="24" x2="39" y2="24" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 4 o'clock -->
    <line x1="39.5" y1="35" x2="35.5" y2="32.5" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
    <!-- 5 o'clock -->
    <line x1="33" y1="41.5" x2="31" y2="37" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
    <!-- 6 o'clock -->
    <line x1="24" y1="44" x2="24" y2="39" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 7 o'clock -->
    <line x1="15" y1="41.5" x2="17" y2="37" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
    <!-- 8 o'clock -->
    <line x1="8.5" y1="35" x2="12.5" y2="32.5" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
    <!-- 9 o'clock -->
    <line x1="4" y1="24" x2="9" y2="24" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 10 o'clock -->
    <line x1="8.5" y1="13" x2="12.5" y2="15.5" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
    <!-- 11 o'clock -->
    <line x1="15" y1="6.5" x2="17" y2="11" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>

    <!-- Minute hand - pointing to ~10 o'clock (upper-left) - dark -->
    <line x1="24" y1="24" x2="12" y2="12" stroke="#18181b" stroke-width="3" stroke-linecap="round"/>

    <!-- Hour hand - pointing to ~5 o'clock (lower-right) - orange -->
    <line x1="24" y1="24" x2="31" y2="37" stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Center dot -->
    <circle cx="24" cy="24" r="2.5" fill="#18181b"/>
  </g>

  <!-- Text: "leadsdaily" -->
  <text x="60" y="38" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" letter-spacing="-0.5">
    <tspan fill="#18181b" font-weight="800">leads</tspan><tspan fill="#f97316" font-weight="400">daily</tspan>
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" fill="none">
  <!-- Clock Icon -->
  <g transform="translate(4, 4)">
    <!-- Outer circle -->
    <circle cx="24" cy="24" r="22" stroke="#18181b" stroke-width="3" fill="none"/>

    <!-- Major tick marks (12, 3, 6, 9) -->
    <line x1="24" y1="2" x2="24" y2="9" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="46" y1="24" x2="39" y2="24" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="46" x2="24" y2="39" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="2" y1="24" x2="9" y2="24" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Minor tick marks -->
    <!-- 1 o'clock -->
    <line x1="33.5" y1="5.5" x2="31" y2="10.5" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 2 o'clock -->
    <line x1="40.5" y1="12.5" x2="36" y2="15.5" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 4 o'clock -->
    <line x1="40.5" y1="35.5" x2="36" y2="32.5" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 5 o'clock -->
    <line x1="33.5" y1="42.5" x2="31" y2="37.5" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 7 o'clock -->
    <line x1="14.5" y1="42.5" x2="17" y2="37.5" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 8 o'clock -->
    <line x1="7.5" y1="35.5" x2="12" y2="32.5" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 10 o'clock -->
    <line x1="7.5" y1="12.5" x2="12" y2="15.5" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 11 o'clock -->
    <line x1="14.5" y1="5.5" x2="17" y2="10.5" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Minute hand - pointing straight up to 12 o'clock - dark -->
    <line x1="24" y1="24" x2="24" y2="8" stroke="#18181b" stroke-width="3" stroke-linecap="round"/>

    <!-- Hour hand - pointing to 5 o'clock - orange arrow -->
    <line x1="24" y1="24" x2="31.5" y2="37" stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Arrowhead on hour hand -->
    <polygon points="31.5,37 27,33 33,32.5" fill="#f97316"/>

    <!-- Center dot -->
    <circle cx="24" cy="24" r="2.5" fill="#18181b"/>
  </g>

  <!-- Text: "leadsdaily" -->
  <text x="60" y="38" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" letter-spacing="-0.5">
    <tspan fill="#18181b" font-weight="800">leads</tspan><tspan fill="#f97316" font-weight="400">daily</tspan>
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 50" fill="none">
  <!-- Clock circle -->
  <circle cx="25" cy="25" r="20" stroke="#18181b" stroke-width="3" fill="none"/>
  <!-- Clock tick marks -->
  <line x1="25" y1="7" x2="25" y2="10" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="40" x2="25" y2="43" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
  <line x1="7" y1="25" x2="10" y2="25" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="25" x2="43" y2="25" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand (dark, pointing to ~10 o'clock) -->
  <line x1="25" y1="25" x2="17" y2="12" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hour hand (orange, pointing to ~5 o'clock / lower right) -->
  <line x1="25" y1="25" x2="32" y2="36" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="25" cy="25" r="2" fill="#f97316"/>
  <!-- "leads" text - dark, bold -->
  <text x="55" y="33" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#18181b" letter-spacing="-0.5">leads</text>
  <!-- "daily" text - orange, regular weight -->
  <text x="148" y="33" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#f97316" letter-spacing="-0.5">daily</text>
</svg>
